[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "devara"
version = "0.7.0"
description = "Compiler for Devara, a Romanized-Telugu statement-oriented language (x86-64 Linux and Windows)"
readme = "README.md"
# The C runtime (runtime/devara_rt.c) is found relative to the checkout: install with `pip install -e .`.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
devara = "compiler.cli:run_main"

[tool.setuptools.packages.find]
include = ["compiler*"]
